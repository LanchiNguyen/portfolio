name: Deploy portfolio to GitHub Pages

# One Pages site, two builds:
#   main    -> https://lananguyen.xyz/
#   preview -> https://lananguyen.xyz/preview/   (banner, noindex, staging)
#
# Every run rebuilds BOTH. That is deliberate: a Pages deploy replaces the
# whole published artifact, so uploading only one build would delete the other.
#
# This only ever runs on `main`. Pages restricts its `github-pages` environment
# to the default branch, so a run on the `preview` ref dies before its first
# step; restage-preview.yml turns a push to `preview` into a dispatch here.
#
# Nothing goes live until GitHub Pages is enabled in
# Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # The preview branch is optional. If it has not been created yet, skip
      # the staging build instead of failing the production deploy.
      - name: Check out preview (staging)
        id: preview-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: preview
          path: preview

      - name: Build production site
        run: bash main/build-site.sh
        env:
          # Set a repository variable SITE_URL (Settings -> Secrets and
          # variables -> Actions -> Variables) if the domain ever changes.
          SITE_URL: ${{ vars.SITE_URL || 'https://lananguyen.xyz' }}

      - name: Build preview site into /preview/
        if: steps.preview-checkout.outcome == 'success'
        run: |
          PREVIEW=1 bash preview/build-site.sh
          mv preview/_site main/_site/preview
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://lananguyen.xyz' }}/preview

      - name: Report what is being published
        run: |
          echo "root pages:    $(ls main/_site/*.html | wc -l)"
          if [ -d main/_site/preview ]; then
            echo "preview pages: $(ls main/_site/preview/*.html | wc -l) (from branch preview)"
          else
            echo "preview pages: none (branch 'preview' does not exist)"
          fi

      # Creating the Pages site can't be done with the workflow token on a
      # user repo — it needs one manual click: Settings -> Pages -> Source:
      # "GitHub Actions". Until then, skip deployment cleanly instead of
      # failing (no more red-X emails).
      - name: Check whether GitHub Pages is enabled
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "enabled=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ]; then
            echo "::notice title=Pages not enabled yet::Enable it once in Settings -> Pages -> Source: GitHub Actions, then re-run this workflow (or push). Skipping deploy, not failing."
          fi

      - if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: main/_site

      - if: steps.pages-check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
